backend:
  name: git-gateway
  branch: claude/yein-portfolio-website-do0o64

# Netlify Identity handles the login popup for this admin panel.
local_backend: false

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

publish_mode: simple

locale: "en"

collections:
  - name: "about"
    label: "About Me Page"
    files:
      - name: "about"
        label: "About Me"
        file: "src/content/about/index.md"
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "School", name: "school", widget: "string" }
          - { label: "Grade", name: "grade", widget: "string" }
          - { label: "Location", name: "location", widget: "string" }
          - label: "Interests"
            name: "interests"
            widget: "list"
            field: { label: "Interest", name: "interest", widget: "string" }
          - label: "Profile Photo"
            name: "photo"
            widget: "image"
            required: false
          - { label: "Favorite Music", name: "favoriteMusic", widget: "string", required: false }
          - { label: "Favorite Movies", name: "favoriteMovies", widget: "string", required: false }
          - { label: "Favorite TV Shows", name: "favoriteShows", widget: "string", required: false }
          - { label: "Favorite Books", name: "favoriteBooks", widget: "string", required: false }
          - { label: "Bio", name: "body", widget: "markdown" }

  - name: "projects"
    label: "Projects (Art / Essay)"
    label_singular: "Project"
    folder: "src/content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Art", value: "art" }
          - { label: "Essay", value: "essay" }
          - { label: "Other", value: "other" }
      - { label: "Date", name: "date", widget: "datetime" }
      - label: "Cover Image"
        name: "cover"
        widget: "image"
        required: false
      - { label: "Summary", name: "summary", widget: "text" }
      - label: "Draft (check to hide from the site)"
        name: "draft"
        widget: "boolean"
        default: false
      - { label: "Content", name: "body", widget: "markdown" }

  - name: "news"
    label: "News Clips"
    label_singular: "News Clip"
    folder: "src/content/news"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Source Name", name: "sourceName", widget: "string" }
      - { label: "Source URL", name: "sourceUrl", widget: "string" }
      - label: "Cover Image"
        name: "cover"
        widget: "image"
        required: false
      - label: "Tags"
        name: "tags"
        widget: "list"
        default: []
        field: { label: "Tag", name: "tag", widget: "string" }
      - label: "Draft (check to hide from the site)"
        name: "draft"
        widget: "boolean"
        default: false
      - label: "Why I saved this"
        name: "body"
        widget: "markdown"

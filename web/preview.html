<title>재택의료NEWS — 집으로 가는, 집에서 하는</title>
<style>
/* =========================================================
   재택의료NEWS — 집으로 가는, 집에서 하는
   디자인 토큰 & 전역 스타일
   ---------------------------------------------------------
   원본의 청록 브랜드 컬러를 딥 틸로 정제하고, 난립하던
   배경색(남색·연녹·베이지)을 3단계 서피스로 정리했습니다.
   ========================================================= */

:root {
  color-scheme: light;

  /* 서피스 */
  --paper:        #faf9f6;   /* 기본 지면 */
  --paper-2:      #f1f0ea;   /* 교차 섹션 (원본 연녹색 자리) */
  --paper-3:      #e7e5db;
  --surface-ink:  #0d1f1d;   /* 헤드라인 밴드 (원본 남색 자리) */
  --surface-warm: #f6f1e6;   /* CTA 밴드 (원본 베이지 자리) */

  /* 잉크 */
  --ink:          #14211f;
  --ink-2:        #33423f;
  --muted:        #6d7471;
  --on-ink:       #f2f0e9;
  --on-ink-muted: #a2a89f;

  /* 브랜드 */
  --teal:         #0e5c57;
  --teal-2:       #157e76;
  --teal-soft:    rgba(14, 92, 87, 0.09);
  --brass:        #a8762e;
  --brass-2:      #c9a05c;

  /* 라인 */
  --line:         rgba(20, 33, 31, 0.13);
  --line-strong:  rgba(20, 33, 31, 0.3);
  --line-on-ink:  rgba(242, 240, 233, 0.18);

  /* 타이포 */
  --serif: "Nanum Myeongjo", "AppleMyungjo", "Noto Serif KR", "Apple SD Gothic Neo",
           "Batang", Georgia, serif;
  --sans:  "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
           "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif;

  /* 리듬 */
  --gutter: clamp(1.25rem, 4vw, 3.25rem);
  --maxw: 1240px;
  --radius: 3px;

  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
}

@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --paper:        #0f1413;
    --paper-2:      #161d1c;
    --paper-3:      #1f2827;
    --surface-ink:  #070c0b;
    --surface-warm: #191712;
    --ink:          #f0eee7;
    --ink-2:        #d2cfc6;
    --muted:        #8f958f;
    --on-ink:       #f0eee7;
    --on-ink-muted: #979d95;
    --teal:         #4aa79e;
    --teal-2:       #63bdb3;
    --teal-soft:    rgba(74, 167, 158, 0.14);
    --brass:        #d3ab6a;
    --brass-2:      #e0be86;
    --line:         rgba(240, 238, 231, 0.14);
    --line-strong:  rgba(240, 238, 231, 0.3);
    --line-on-ink:  rgba(240, 238, 231, 0.16);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --paper:        #0f1413;
  --paper-2:      #161d1c;
  --paper-3:      #1f2827;
  --surface-ink:  #070c0b;
  --surface-warm: #191712;
  --ink:          #f0eee7;
  --ink-2:        #d2cfc6;
  --muted:        #8f958f;
  --on-ink:       #f0eee7;
  --on-ink-muted: #979d95;
  --teal:         #4aa79e;
  --teal-2:       #63bdb3;
  --teal-soft:    rgba(74, 167, 158, 0.14);
  --brass:        #d3ab6a;
  --brass-2:      #e0be86;
  --line:         rgba(240, 238, 231, 0.14);
  --line-strong:  rgba(240, 238, 231, 0.3);
  --line-on-ink:  rgba(240, 238, 231, 0.16);
}

/* ---------- 리셋 ---------- */

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.75;
  letter-spacing: -0.011em;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

img, svg { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }

/* .card 등의 display 선언이 UA 스타일시트의 [hidden]을 덮어쓰지 않도록 */
[hidden] { display: none !important; }

h1, h2, h3, h4 {
  font-family: var(--serif);
  font-weight: 700;
  line-height: 1.32;
  letter-spacing: -0.025em;
  margin: 0;
  word-break: keep-all;
}

p { margin: 0; }

::selection { background: var(--teal); color: #fff; }

:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }

.skip-link {
  position: absolute; left: -9999px; top: 0;
  background: var(--ink); color: var(--on-ink);
  padding: 0.75rem 1.25rem; z-index: 200;
}
.skip-link:focus { left: 0; }

/* ---------- 레이아웃 ---------- */

.wrap {
  width: 100%;
  max-width: var(--maxw);
  margin-inline: auto;
  padding-inline: var(--gutter);
}

.rule { height: 1px; background: var(--line); border: 0; margin: 0; }
.rule--strong { background: var(--line-strong); }

.section { padding-block: clamp(3rem, 6vw, 5.5rem); }
.section--tight { padding-block: clamp(2rem, 4vw, 3.25rem); }

/* ---------- 라벨 ---------- */

.eyebrow {
  font-size: 0.6875rem;
  font-weight: 700;
  letter-spacing: 0.17em;
  text-transform: uppercase;
  color: var(--teal);
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  line-height: 1;
}
.eyebrow::before {
  content: "";
  width: 1.5rem; height: 1px;
  background: currentColor; opacity: 0.6;
}
.eyebrow--bare::before { display: none; }

.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1.25rem;
  flex-wrap: wrap;
  padding-bottom: 0.9rem;
  border-bottom: 2px solid var(--ink);
  margin-bottom: clamp(1.5rem, 2.5vw, 2.25rem);
}

.section-head h2 {
  font-size: clamp(1.25rem, 2.2vw, 1.75rem);
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
}

.section-head h2 .en {
  font-family: var(--sans);
  font-size: 0.625rem;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}

.link-more {
  font-size: 0.8125rem;
  color: var(--muted);
  transition: color 0.25s var(--ease);
  white-space: nowrap;
}
.link-more:hover { color: var(--teal); }

/* ---------- 상단 유틸 바 ---------- */

.topbar {
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  font-size: 0.75rem;
}

.topbar__inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  min-height: 44px;
  flex-wrap: wrap;
}

.topbar__date {
  font-family: var(--serif);
  font-size: 0.875rem;
  letter-spacing: -0.02em;
  color: var(--ink-2);
}
.topbar__date strong { color: var(--ink); font-weight: 700; }

.topbar__links {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  color: var(--muted);
}
.topbar__links a { transition: color 0.2s var(--ease); }
.topbar__links a:hover { color: var(--teal); }
.topbar__links .sep { opacity: 0.4; }

.social {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  margin-left: 0.4rem;
}
.social a {
  width: 26px; height: 26px;
  display: inline-grid; place-items: center;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  font-size: 0.625rem;
  font-weight: 700;
  color: var(--muted);
  transition: all 0.25s var(--ease);
}
.social a:hover { background: var(--teal); border-color: var(--teal); color: #fff; }

.theme-toggle {
  background: none;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  padding: 0.2rem 0.7rem;
  font-size: 0.625rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.2s var(--ease);
}
.theme-toggle:hover { color: var(--teal); border-color: var(--teal); }

/* ---------- 검색 ---------- */

.searchrow {
  display: flex;
  justify-content: flex-end;
  padding-block: 0.9rem;
}

.search {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  width: min(320px, 100%);
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  padding: 0.4rem 0.5rem 0.4rem 1.1rem;
  background: var(--paper-2);
  transition: border-color 0.25s var(--ease);
}
.search:focus-within { border-color: var(--teal); }
.search input {
  flex: 1; min-width: 0;
  border: 0; background: none; outline: none;
  font: inherit; font-size: 0.8125rem;
  color: var(--ink);
}
.search input::placeholder { color: var(--muted); }
.search button {
  border: 0; background: var(--teal); color: #fff;
  width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center;
  cursor: pointer; font-size: 0.75rem;
  transition: background 0.25s var(--ease);
}
.search button:hover { background: var(--ink); }

/* ---------- 마스트헤드 ---------- */

.masthead {
  background: var(--paper);
  border-bottom: 2px solid var(--ink);
  position: sticky; top: 0; z-index: 100;
  transition: box-shadow 0.3s var(--ease);
}
.masthead.is-stuck { box-shadow: 0 2px 20px rgba(20, 33, 31, 0.09); }

.masthead__inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: clamp(1rem, 4vw, 3rem);
  padding-block: clamp(0.9rem, 2vw, 1.5rem);
  transition: padding 0.3s var(--ease);
}
.masthead.is-stuck .masthead__inner { padding-block: 0.6rem; }

.brand { display: inline-flex; flex-direction: column; gap: 0.5rem; }

.brand__mark {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  background: var(--teal);
  color: #fff;
  padding: 0.45rem 0.9rem;
  border-radius: var(--radius);
  font-family: var(--sans);
  font-size: clamp(1.0625rem, 2.4vw, 1.5rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.1;
  white-space: nowrap;
}
.brand__mark .home { font-size: 1.1em; line-height: 1; }
.brand__mark .news { letter-spacing: 0.01em; }

.brand__slogan {
  font-family: var(--serif);
  font-size: 0.875rem;
  color: var(--muted);
  letter-spacing: -0.02em;
}
.masthead.is-stuck .brand__slogan { display: none; }
.masthead.is-stuck .brand__mark { font-size: 1rem; padding: 0.3rem 0.7rem; }

/* ---------- 메뉴 ---------- */

.mainnav__list {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 0.35rem clamp(0.9rem, 2vw, 1.75rem);
  list-style: none;
  margin: 0;
  padding: 0;
}

.mainnav__link {
  font-size: 0.9375rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--ink-2);
  position: relative;
  padding-block: 0.35rem;
  white-space: nowrap;
  transition: color 0.25s var(--ease);
}
.mainnav__link .hi { color: var(--brass); }
.mainnav__link::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: 0;
  height: 2px; background: var(--teal);
  transform: scaleX(0); transform-origin: left;
  transition: transform 0.35s var(--ease);
}
.mainnav__link:hover { color: var(--ink); }
.mainnav__link:hover::after,
.mainnav__link[aria-current="page"]::after { transform: scaleX(1); }
.mainnav__link[aria-current="page"] { color: var(--teal); }

@media (max-width: 900px) {
  .masthead__inner { flex-direction: column; align-items: flex-start; }
  .mainnav__list { justify-content: flex-start; }
  .searchrow { justify-content: stretch; }
  .search { width: 100%; }
}

@media (max-width: 620px) {
  .mainnav__list {
    flex-wrap: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
    width: 100%;
  }
  .mainnav__list::-webkit-scrollbar { display: none; }
  .topbar__date { font-size: 0.8125rem; }
}

/* ---------- 이미지 플레이트 (사진 자리) ---------- */

.plate {
  position: relative;
  overflow: hidden;
  background: linear-gradient(145deg, #16302c 0%, #275049 48%, #3f6f63 100%);
  border-radius: var(--radius);
  isolation: isolate;
}
.plate::after {
  content: "";
  position: absolute; inset: 0;
  background:
    radial-gradient(120% 90% at 22% 0%, rgba(255, 255, 255, 0.17), transparent 62%),
    repeating-linear-gradient(118deg, rgba(255, 255, 255, 0.05) 0 1px, transparent 1px 8px);
  mix-blend-mode: soft-light;
}
.plate--warm  { background: linear-gradient(145deg, #34281a 0%, #6b5227 50%, #a8762e 100%); }
.plate--sage  { background: linear-gradient(145deg, #1f2a22 0%, #3b4d3d 50%, #61775f 100%); }
.plate--clay  { background: linear-gradient(145deg, #2c221f 0%, #4f3934 50%, #7d5b4e 100%); }
.plate--slate { background: linear-gradient(145deg, #171d22 0%, #323d46 50%, #5a6672 100%); }

.plate__caption {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 1rem;
  color: rgba(255, 255, 255, 0.76);
  font-size: 0.625rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  background: linear-gradient(to top, rgba(0, 0, 0, 0.5), transparent);
  z-index: 1;
}

.ratio-16x9 { aspect-ratio: 16 / 9; }
.ratio-4x3  { aspect-ratio: 4 / 3; }
.ratio-3x2  { aspect-ratio: 3 / 2; }
.ratio-1x1  { aspect-ratio: 1 / 1; }

/* ---------- 기사 카드 ---------- */

.card { display: flex; flex-direction: column; gap: 0.7rem; }

.card__media { overflow: hidden; border-radius: var(--radius); }
.card__media .plate { transition: transform 0.7s var(--ease); }
.card:hover .card__media .plate { transform: scale(1.04); }

.card__kicker {
  font-size: 0.6875rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--teal);
}

.card__title {
  font-size: 1.0625rem;
  line-height: 1.44;
  transition: color 0.25s var(--ease);
}
.card:hover .card__title { color: var(--teal); }

.card__excerpt {
  font-size: 0.875rem;
  color: var(--muted);
  line-height: 1.72;
  word-break: keep-all;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card__excerpt .byline-tag { color: var(--ink-2); font-weight: 600; }

.card__meta {
  font-size: 0.75rem;
  color: var(--muted);
  display: flex;
  gap: 0.55rem;
  align-items: center;
  margin-top: auto;
  padding-top: 0.15rem;
}
.card__meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--line-strong); }

.card--row { flex-direction: row; gap: 1rem; align-items: flex-start; }
.card--row .card__media { flex: 0 0 clamp(88px, 24%, 132px); }
.card--row .card__title { font-size: 0.9375rem; }

/* ---------- 헤드라인 밴드 (히어로) ---------- */

.headline-band {
  background: var(--surface-ink);
  color: var(--on-ink);
  padding-block: clamp(2rem, 4vw, 3.25rem);
}

.headline-band .card__title,
.headline-band h1, .headline-band h2 { color: var(--on-ink); }
.headline-band .card__excerpt { color: var(--on-ink-muted); }
.headline-band .card__excerpt .byline-tag { color: #d7d3c8; }
.headline-band .card__meta { color: var(--on-ink-muted); }
.headline-band .card__kicker { color: var(--brass-2); }
.headline-band .card:hover .card__title { color: var(--brass-2); }

.headline-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.32fr) minmax(0, 1fr);
  gap: clamp(1.5rem, 3vw, 2.5rem);
  align-items: start;
}

.headline-lead .card__media { margin-bottom: 1.25rem; }
.headline-lead .card__title { font-size: clamp(1.375rem, 2.9vw, 2.125rem); line-height: 1.34; }
.headline-lead .card__excerpt { font-size: 0.9375rem; -webkit-line-clamp: 2; }

.headline-sub {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: clamp(1rem, 2vw, 1.5rem);
}
.headline-sub .card__title { font-size: 0.9375rem; }
.headline-sub .card__excerpt { font-size: 0.8125rem; -webkit-line-clamp: 3; }

@media (max-width: 940px) {
  .headline-grid { grid-template-columns: 1fr; }
}
@media (max-width: 520px) {
  .headline-sub { grid-template-columns: 1fr; }
  .headline-sub .card { flex-direction: row; gap: 0.9rem; }
  .headline-sub .card__media { flex: 0 0 110px; }
  .headline-sub .card__excerpt { display: none; }
}

/* ---------- 본문 2단 레이아웃 ---------- */

.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 310px);
  gap: clamp(2rem, 4vw, 3.5rem);
  align-items: start;
}

.layout__main > * + * { margin-top: clamp(2.5rem, 5vw, 4rem); }
.layout__side { display: grid; gap: clamp(2rem, 3.5vw, 2.75rem); position: sticky; top: 96px; }

@media (max-width: 960px) {
  .layout { grid-template-columns: 1fr; }
  .layout__side { position: static; }
}

/* ---------- 그리드 ---------- */

.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: clamp(1.5rem, 2.5vw, 2.25rem);
}
.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: clamp(1.5rem, 2.5vw, 2.25rem);
}
.grid-2 > *, .grid-3 > * { min-width: 0; }

@media (max-width: 900px) { .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) {
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .card--row .card__media { flex-basis: 104px; }
}

/* ---------- 사이드바 위젯 ---------- */

.widget__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
  padding-bottom: 0.7rem;
  border-bottom: 2px solid var(--ink);
  margin-bottom: 1.25rem;
}
.widget__head h2 { font-size: 1.125rem; }

.widget__body { display: grid; gap: 1.25rem; }

/* 칼럼니스트 배너 */
.columnist {
  display: flex;
  align-items: center;
  gap: 1rem;
  background: var(--paper-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1.1rem 1.25rem;
  transition: border-color 0.25s var(--ease);
}
.columnist:hover { border-color: var(--teal); }
.columnist__photo {
  flex: 0 0 62px;
  height: 62px;
  border-radius: 50%;
  background: linear-gradient(145deg, #274b45, #4a7a6f);
  position: relative;
  overflow: hidden;
}
.columnist__photo::after {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(70% 60% at 50% 22%, rgba(255,255,255,.24), transparent 70%);
}
.columnist__name { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.02em; }
.columnist__title {
  font-family: var(--serif);
  font-size: 1.0625rem;
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1.4;
  margin-top: 0.2rem;
}

/* 금주의 핫뉴스 */
.ranklist { list-style: none; margin: 0; padding: 0; counter-reset: rank; }
.ranklist li {
  counter-increment: rank;
  display: flex;
  gap: 0.85rem;
  align-items: baseline;
  padding-block: 0.7rem;
  border-bottom: 1px solid var(--line);
}
.ranklist li:last-child { border-bottom: 0; }
.ranklist li::before {
  content: counter(rank, decimal-leading-zero);
  font-family: var(--serif);
  font-size: 0.8125rem;
  font-weight: 700;
  color: var(--brass);
  flex: none;
  width: 1.4rem;
}
.ranklist a {
  font-size: 0.875rem;
  line-height: 1.55;
  color: var(--ink-2);
  word-break: keep-all;
  transition: color 0.25s var(--ease);
}
.ranklist a:hover { color: var(--teal); }

/* ---------- 검색 서비스 카드 3종 ---------- */

<script>
/* =========================================================
   재택의료NEWS — 공용 스크립트
   - 다크/라이트 테마 토글 (localStorage 저장)
   - 스크롤 시 마스트헤드 축소
   - 스크롤 진입 애니메이션
   - 기사 읽기 진행률
   - 뉴스 목록 카테고리 필터
   - 오늘 날짜 표기
   ========================================================= */

(function () {
  'use strict';

  /* ---------- 테마 ---------- */

  var STORAGE_KEY = 'hcj-theme';

  function applyTheme(theme) {
    if (theme === 'light' || theme === 'dark') {
      document.documentElement.setAttribute('data-theme', theme);
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
  }

  function currentTheme() {
    var stored = null;
    try { stored = localStorage.getItem(STORAGE_KEY); } catch (e) { /* ignore */ }
    if (stored) return stored;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  try { applyTheme(localStorage.getItem(STORAGE_KEY)); } catch (e) { /* ignore */ }

  function initTheme() {
    var buttons = document.querySelectorAll('[data-theme-toggle]');
    if (!buttons.length) return;

    function label(theme) {
      return theme === 'dark' ? 'LIGHT' : 'DARK';
    }

    function sync() {
      var t = currentTheme();
      buttons.forEach(function (btn) {
        btn.textContent = label(t);
        btn.setAttribute('aria-label', t === 'dark' ? '밝은 화면으로 전환' : '어두운 화면으로 전환');
      });
    }

    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        var next = currentTheme() === 'dark' ? 'light' : 'dark';
        applyTheme(next);
        try { localStorage.setItem(STORAGE_KEY, next); } catch (e) { /* ignore */ }
        sync();
      });
    });

    sync();
  }

  /* ---------- 마스트헤드 ---------- */

  var mastheadBound = false;

  function initMasthead() {
    var threshold = 90;
    var ticking = false;

    function update() {
      var masthead = document.querySelector('.masthead');
      if (masthead) masthead.classList.toggle('is-stuck', window.scrollY > threshold);
      ticking = false;
    }

    if (!mastheadBound) {
      window.addEventListener('scroll', function () {
        if (!ticking) {
          window.requestAnimationFrame(update);
          ticking = true;
        }
      }, { passive: true });
      mastheadBound = true;
    }

    update();
  }

  /* ---------- 스크롤 진입 애니메이션 ---------- */

  function initReveal() {
    var items = document.querySelectorAll('.reveal');
    if (!items.length) return;

    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced || !('IntersectionObserver' in window)) {
      items.forEach(function (el) { el.classList.add('is-visible'); });
      return;
    }

    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        var el = entry.target;
        var delay = Number(el.getAttribute('data-reveal-delay') || 0);
        setTimeout(function () { el.classList.add('is-visible'); }, delay);
        observer.unobserve(el);
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });

    items.forEach(function (el) { observer.observe(el); });
  }

  /* ---------- 읽기 진행률 ---------- */

  var progressBound = false;

  function initProgress() {
    var ticking = false;

    function update() {
      var bar = document.querySelector('.progress');
      var body = document.querySelector('.article-body');
      if (!bar) return;
      if (!body) { bar.style.width = '0'; return; }

      var rect = body.getBoundingClientRect();
      var total = rect.height - window.innerHeight;
      var scrolled = -rect.top;
      var pct = total > 0 ? Math.min(Math.max(scrolled / total, 0), 1) : 0;
      bar.style.width = (pct * 100).toFixed(2) + '%';
      ticking = false;
    }

    if (!progressBound) {
      window.addEventListener('scroll', function () {
        if (!ticking) {
          window.requestAnimationFrame(update);
          ticking = true;
        }
      }, { passive: true });
      window.addEventListener('resize', update);
      progressBound = true;
    }

    update();
  }

  /* ---------- 카테고리 필터 ---------- */

  function initFilters() {
    var chips = document.querySelectorAll('[data-filter]');
    var items = document.querySelectorAll('[data-category]');
    if (!chips.length || !items.length) return;

    var count = document.querySelector('[data-filter-count]');
    var known = {};
    chips.forEach(function (chip) { known[chip.getAttribute('data-filter')] = chip; });

    function apply(value) {
      var shown = 0;
      items.forEach(function (item) {
        var match = value === 'all' || item.getAttribute('data-category') === value;
        item.hidden = !match;
        if (match) shown += 1;
      });
      if (count) count.textContent = String(shown);
    }

    function select(value) {
      var chip = known[value] || known.all;
      chips.forEach(function (c) { c.setAttribute('aria-pressed', 'false'); });
      chip.setAttribute('aria-pressed', 'true');
      apply(chip.getAttribute('data-filter'));
    }

    chips.forEach(function (chip) {
      chip.addEventListener('click', function () {
        select(chip.getAttribute('data-filter'));
      });
    });

    // ?cat=hot 처럼 주소로 들어온 카테고리를 초기 선택값으로 사용
    // (단일 파일 미리보기에서는 라우터가 window.__hcjCat 으로 넘긴다)
    var initial = 'all';
    try {
      var cat = window.__hcjCat || new URLSearchParams(window.location.search).get('cat');
      if (cat && known[cat]) initial = cat;
    } catch (e) { /* ignore */ }

    select(initial);
  }

  /* ---------- 오늘 날짜 ---------- */

  function initDate() {
    var nodes = document.querySelectorAll('[data-today]');
    if (!nodes.length) return;

    function pad(n) { return n < 10 ? '0' + n : String(n); }

    var now = new Date();
    var days = ['일', '월', '화', '수', '목', '금', '토'];
    var md = pad(now.getMonth() + 1) + '.' + pad(now.getDate());
    var suffix = ' ' + days[now.getDay()] + '요일';

    nodes.forEach(function (node) {
      // 2026.08.02 일요일 — 월·일만 강조
      node.textContent = '';
      node.appendChild(document.createTextNode(now.getFullYear() + '.'));
      var strong = document.createElement('strong');
      strong.textContent = md;
      node.appendChild(strong);
      node.appendChild(document.createTextNode(suffix));
    });
  }

  /* ---------- 구독 폼 (데모) ---------- */

  function initSubscribe() {
    var forms = document.querySelectorAll('[data-subscribe]');
    forms.forEach(function (form) {
      form.addEventListener('submit', function (event) {
        event.preventDefault();
        var note = form.querySelector('[data-subscribe-note]');
        if (note) {
          note.textContent = '초안 데모입니다. 실제 서비스 연동 시 이 자리에서 처리 결과를 안내합니다.';
          note.style.color = 'var(--brass)';
        }
        form.reset();
      });
    });
  }

  function ready(fn) {
    if (document.readyState !== 'loading') fn();
    else document.addEventListener('DOMContentLoaded', fn);
  }

  function initAll() {
    initTheme();
    initMasthead();
    initReveal();
    initProgress();
    initFilters();
    initDate();
    initSubscribe();
  }

  ready(initAll);

  // 단일 파일 미리보기(preview.html)에서 화면 전환 후 다시 호출한다.
  window.HCJ = { init: initAll };
})();


/* ---------- 단일 파일 미리보기 라우터 ----------
   6개 페이지를 한 파일에 담아 해시(#/news?cat=hot)로 전환한다.

iv class=\"plate plate--sage ratio-16x9\"></div></a>\n          <span class=\"card__kicker\">건강정보</span>\n          <h3 class=\"card__title\"><a href=\"article.html\">나이 들어도 40대 수준의 뇌를 유지하는 방법은?</a></h3>\n          <p class=\"card__excerpt\"><span class=\"byline-tag\">[재택의료NEWS=허연회 기자]</span> 노쇠를 피할 수는 없다. 다만 노쇠의 속도는 늦출 수밖에 없다. 단순히 오래 사는 것보다…</p>\n          <div class=\"card__meta\"><span>2026.07.19</span><span class=\"dot\" aria-hidden=\"true\"></span><span>허연회 기자</span></div>\n        </article>\n        <article class=\"card reveal\" data-category=\"health\" data-reveal-delay=\"140\">\n          <a class=\"card__media\" href=\"article.html\"><div class=\"plate plate--clay ratio-16x9\"></div></a>\n          <span class=\"card__kicker\">건강정보</span>\n          <h3 class=\"card__title\"><a href=\"article.html\">돈을 준다고 해도 먹지 말아야 할 음식은?</a></h3>\n          <p class=\"card__excerpt\"><span class=\"byline-tag\">[재택의료NEWS=허연회 기자]</span> 물가가 계속 오르고 있다. 식료품 값도 천정부지로 오르고 있다. 그렇다고 아무거나…</p>\n          <div class=\"card__meta\"><span>2026.07.17</span><span class=\"dot\" aria-hidden=\"true\"></span><span>허연회 기자</span></div>\n        </article>\n        <article class=\"card reveal\" data-category=\"health\">\n          <a class=\"card__media\" href=\"article.html\"><div class=\"plate ratio-16x9\"></div></a>\n          <span class=\"card__kicker\">건강정보</span>\n          <h3 class=\"card__title\"><a href=\"article.html\">나쁜 기름은 줄이고, 좋은 기름은 높이고…먹는 기름도 중요하다!</a></h3>\n          <p class=\"card__excerpt\"><span class=\"byline-tag\">[재택의료NEWS=허연회 기자]</span> &#39;기름&#39;은 중요하다. 매일 기름을 섭취할 수밖에 없기 때문에 가려서 먹어야 한다.</p>\n          <div class=\"card__meta\"><span>2026.07.15</span><span class=\"dot\" aria-hidden=\"true\"></span><span>허연회 기자</span></div>\n        </article>\n        <article class=\"card reveal\" data-category=\"hot\" data-reveal-delay=\"70\">\n          <a class=\"card__media\" href=\"article.html\"><div class=\"plate plate--slate ratio-16x9\"></div></a>\n          <span class=\"card__kicker\">재택의료HOT</span>\n          <h3 class=\"card__title\"><a href=\"article.html\">WHY? 의사들은 재택의료센터를 만들려 하는가</a></h3>\n          <p class=\"card__excerpt\"><span class=\"byline-tag\">[재택의료NEWS=허연회 기자]</span> 재택의료센터를 신청하는 의료기관이 빠르게 늘고 있다. 수가만으로 설명되지 않는 이유가…</p>\n          <div class=\"card__meta\"><span>2026.07.14</span><span class=\"dot\" aria-hidden=\"true\"></span><span>허연회 기자</span></div>\n        </article>\n        <article class=\"card reveal\" data-category=\"column\" data-reveal-delay=\"140\">\n          <a class=\"card__media\" href=\"article.html\"><div class=\"plate plate--warm ratio-16x9\"></div></a>\n          <span class=\"card__kicker\">칼럼</span>\n          <h3 class=\"card__title\"><a href=\"article.html\">[이호재 소장의 건강돌봄, 재산돌봄] &#39;노노&#39;(老老) 케어를 하고 있는 부모님들</a></h3>\n          <p class=\"card__excerpt\"><span class=\"byline-tag\">[재택의료NEWS=허연회 기자]</span> 노인이 노인을 돌보는 시대다. 돌봄의 비용은 건강만이 아니라 재산의 문제이기도 하다.</p>\n          <div class=\"card__meta\"><span>2026.07.12</span><span class=\"dot\" aria-hidden=\"true\"></span><span>허연회 기자</span></div>\n        </article>\n      </div>\n\n      <div class=\"center mt-4\" style=\"padding-top: 1.5rem;\">\n        <button class=\"btn btn--ghost\" type=\"button\">기사 더 보기</button>\n      </div>\n    </div>\n  </section>\n\n</main>\n\n<!-- ================= 푸터 ================= -->\n<footer class=\"footer\">\n  <div class=\"wrap\">\n    <div class=\"footer__top\">\n      <div>\n        <span class=\"brand__mark\"><span class=\"home\" aria-hidden=\"true\">⌂</span>재택의료<span class=\"news\">NEWS</span></span>\n        <p class=\"footer__slogan\">집으로 가는, 집에서 하는</p>\n      </div>\n\n      <div>\n        <p class=\"footer__legal\">\n          &lt;재택의료NEWS&gt;<span class=\"sep\">|</span>대표: <strong>배재원</strong><span class=\"sep\">|</span>서울 용산구 청파로47길 7 (청파동3가) 5층 501호<span class=\"sep\">|</span>고객센터: <strong>1800-75(치료)83</strong><span class=\"sep\">|</span>등록번호: 서울, 아56580<span class=\"sep\">|</span>등록일자: 2026.06 div>\n\n<!-- ================= 마스트헤드 ================= -->\n<header class=\"masthead\">\n  <div class=\"wrap masthead__inner\">\n    <a class=\"brand\" href=\"index.html\">\n      <span class=\"brand__mark\"><span class=\"home\" aria-hidden=\"true\">⌂</span>재택의료<span class=\"news\">NEWS</span></span>\n      <span class=\"brand__slogan\">집으로 가는, 집에서 하는</span>\n    </a>\n\n    <nav class=\"mainnav\" aria-label=\"주요 메뉴\">\n      <ul class=\"mainnav__list\">\n        <li><a class=\"mainnav__link\" href=\"news.html\">재택의료NEWS</a></li>\n        <li><a class=\"mainnav__link\" href=\"news.html?cat=hot\" aria-current=\"page\">재택의료<span class=\"hi\">HOT</span> 이슈 추적</a></li>\n        <li><a class=\"mainnav__link\" href=\"local.html\">우리동네재택의료</a></li>\n        <li><a class=\"mainnav__link\" href=\"news.html?cat=nursing\">가정간호·방문간호</a></li>\n        <li><a class=\"mainnav__link\" href=\"qna.html\">재택의료 Q&amp;A</a></li>\n        <li><a class=\"mainnav__link\" href=\"news.html?cat=health\">건강정보</a></li>\n      </ul>\n    </nav>\n  </div>\n</header>\n\n\n<main id=\"main\">\n\n  <article>\n    <header class=\"article-head\">\n      <div class=\"wrap\">\n        <div class=\"article-head__inner\">\n          <span class=\"eyebrow\">재택의료HOT 이슈 추적</span>\n          <h1>65세 이상 고령층…전체 인구의 20.7%에,<br>자살률 역시 OECD 국가 1위…솔루션은 재택의료일 수 있는데…</h1>\n          <p class=\"standfirst\">\n            인구 5명 중 1명이 노인인 사회가 됐다. 노인 자살률은 여전히 OECD 최고 수준이다.\n            병원까지 가지 못하는 노인을 집에서 만나는 재택의료가 해법의 한 축으로 거론되지만,\n            현장의 준비는 통계의 속도를 따라가지 못하고 있다.\n          </p>\n          <div class=\"byline\">\n            <strong>허연회 기자</strong>\n            <span aria-hidden=\"true\">·</span>\n            <time datetime=\"2026-08-01\">2026년 8월 1일</time>\n            <span aria-hidden=\"true\">·</span>\n            <span>읽는 데 6분</span>\n          </div>\n        </div>\n      </div>\n    </header>\n\n    <div class=\"wrap layout\">\n      <div class=\"layout__main\">\n        <figure class=\"figure-wide\" style=\"margin-top:0;\">\n          <div class=\"plate plate--slate ratio-16x9\">\n            <span class=\"plate__caption\">사진 · 재택의료NEWS (이미지 자리)</span>\n          </div>\n          <figcaption>지하철역 노인우대석 앞에 앉은 어르신. 사진은 기사 내용과 직접 관련이 없다. (예시 이미지)</figcaption>\n        </figure>\n\n        <div class=\"article-body\">\n          <p class=\"article-lead\">[재택의료NEWS=허연회 기자]</p>\n\n          <p>\n            65세 이상 고령 인구가 전체 인구의 <strong>20.7%</strong>에 달하는 것으로 나타났다.\n            국가데이터처가 발표한 &#39;2025년 인구주택총조사 등록센서스 결과&#39;에 담긴 수치다.\n            인구 5명 중 1명이 노인인 초고령사회가 통계로 확인된 셈이다.\n          </p>\n\n          <p>\n            문제는 숫자의 크기가 아니라 그 안의 내용이다. 우리나라 노인 자살률은 여전히\n            OECD 회원국 가운데 가장 높다. 만성질환을 두세 개씩 안고 살면서도 병원까지 가는\n            일 자체가 어려운 노인이 늘고 있다.\n          </p>\n\n          <h2>&#39;병원에 못 가는&#39; 노인이 늘고 있다</h2>\n\n          <p>\n            거동이 불편해지면 진료는 자연히 뜸해진다. 약이 떨어져도 처방을 받으러 나가지\n            못하고, 상태가 나빠져도 응급실에 실려 가고 나서야 상황이 확인된다. 입원과 퇴원을\n            반복하는 사이 노인의 기능은 계단식으로 떨어진다.\n          </p>\n\n          <blockquote class=\"pull\">\n            &quot;병원에 오지 못하는 환자를 기다리는 것이 아니라, 우리가 가는 겁니다.\n            그 차이가 생각보다 큽니다.&quot;\n          </blockquote>\n\n          <p>\n            의사·간호사·사회복지사가 한 팀을 이뤄 집을 방문하는 <strong>재택의료센터</strong>가\n            해법의 한 축으로 거론되는 이유다. 방문진료로 의학적 문제를 관리하고, 간호가\n            일상적인 처치를 맡고, 사회복지사가 지역의 돌봄 자원을 연결한다.\n          </p>\n\n          <h3>남은 과제 세 가지</h3>\n\n          <ul>\n            <li><strong>인력</strong> — 지정을 받고도 팀을 꾸리지 못해 환자를 받지 못하는 기관이 있다.</li>\n            <li><strong>이동거리</strong> — 읍·면 지역은 이동에만 두 시간이 걸리는 방문이 흔하다.</li>\n            <li><strong>연계</strong> — 퇴원 환자를 지역 재택의료로 넘기는 통로가 아직 얇다.</li>\n          </ul>\n\n          <h2>&#39;찾아가는 의료&#39;가 자살률까지 낮출 수 있을까</h2>\n\n          <p>\n            노인 자살의 배경에는 질병과 통증만 있는 것이 아니다. 고립이 있다. 매달 정해진\n            날짜에 누군가 문을 두드리는 일 자체가 개입이 된다는 것이 현장의 이야기다.\n            재택의료가 의료의 축소가 아니라 확장으로 읽히는 지점이다.\n          </p>\n\n          <p>\n            우리 동네에 어떤 재택의료 기관이 있는지는\n            <a class=\"inline\" href=\"local.html\">우리동네재택의료</a>에서 확인할 수 있다.\n          </p>\n        </div>\n\n        <div class=\"article-foot\">\n          <div class=\"tag-list\">\n            <a href=\"news.html?cat=hot\">#초고령사회</a>\n            <a href=\"news.html?cat=hot\">#재택의료센터</a>\n            <a href=\"news.html?cat=hot\">#방문진료</a>\n            <a href=\"news.html?cat=local\">#노인자살</a>\n          </div>\n          <span>&copy; 재택의료NEWS</span>\n        </div>\n      </div>\n\n      <aside class=\"layout__side\">\n        <section>\n          <div class=\"widget__head\"><h2>금주의 핫뉴스</h2></div>\n          <ol class=\"ranklist\">\n            <li><a href=\"article.html\">당신은 &#39;치매&#39; 걸리지 않을 것 같죠?</a></li>\n            <li><a href=\"article.html\">멀리 큰 병원 갈 필요 없이 동네에서 주치의를…</a></li>\n            <li><a href=\"article.html\">WHY? 의사들은 재택의료센터를 만들려 하는가</a></li>\n            <li><a href=\"article.html\">경북 영덕군 재택의료센터 &#39;경대연합의원&#39;…</a></li>\n            <li><a href=\"article.html\">요양병원 간병비 급여화될 경우…재택의료는</a></li>\n            <li><a href=\"article.html\">중증 입원 후 병원에서는 퇴원하라 하고…</a></li>\n            <li><a href=\"article.html\">오전 10시부터 오후 6시 사이 시간에만…</a></li>\n            <li><a href=\"article.html\">케어(Care) &#39;디렉터&#39;, &#39;퍼포머&#39;, &#39;매니저&#39;…</a></li>\n          </ol>\n        </section>\n\n        <a class=\"columnist\" href=\"news.html?cat=column\">\n          <span class=\"columnist__photo\" aria-hidden=\"true\"></span>\n          <span>\n            <span class=\"columnist__name\">이호재 소장의</span>\n            <span class=\"columnist__title\">건강돌봄,<br>재산돌봄</span>\n          </span>\n        </a>\n      </aside>\n    </div>\n  </article>\n\n  <section class=\"section\" style=\"background: var(--paper-2); border-top: 1px solid var(--line);\">\n    <div class=\"wrap\">\n      <div class=\"section-head\">\n        <h2>관련 기사 <span class=\"en\">Related</span></h2>\n        <a class=\"link-more\" href=\"news.html\">전체 기사 →</a>\n      </div>\n      < \"index.html\">\n      <span class=\"brand__mark\"><span class=\"home\" aria-hidden=\"true\">⌂</span>재택의료<span class=\"news\">NEWS</span></span>\n      <span class=\"brand__slogan\">집으로 가는, 집에서 하는</span>\n    </a>\n\n    <nav class=\"mainnav\" aria-label=\"주요 메뉴\">\n      <ul class=\"mainnav__list\">\n        <li><a class=\"mainnav__link\" href=\"news.html\">재택의료NEWS</a></li>\n        <li><a class=\"mainnav__link\" href=\"news.html?cat=hot\">재택의료<span class=\"hi\">HOT</span> 이슈 추적</a></li>\n        <li><a class=\"mainnav__link\" href=\"local.html\">우리동네재택의료</a></li>\n        <li><a class=\"mainnav__link\" href=\"news.html?cat=nursing\">가정간호·방문간호</a></li>\n        <li><a class=\"mainnav__link\" href=\"qna.html\" aria-current=\"page\">재택의료 Q&amp;A</a></li>\n        <li><a class=\"mainnav__link\" href=\"news.html?cat=health\">건강정보</a></li>\n      </ul>\n    </nav>\n  </div>\n</header>\n\n\n<main id=\"main\">\n\n  <section class=\"page-head\">\n    <div class=\"wrap\">\n      <span class=\"eyebrow\">Q&amp;A</span>\n      <h1>재택의료 Q&amp;A</h1>\n      <p>재택의료 이용 대상은 거동이 불편한 장기요양수급자입니다.\n        자주 묻는 질문을 모았습니다. 여기에 없는 내용은 아래로 문의해 주세요.</p>\n    </div>\n  </section>\n\n  <section class=\"section\">\n    <div class=\"wrap layout\">\n      <div class=\"layout__main\">\n        <div class=\"section-head\">\n          <h2>자주 묻는 질문 <span class=\"en\">FAQ</span></h2>\n        </div>\n        <div class=\"qa\">\n        <details>\n          <summary>재택의료는 누가 이용할 수 있나요?</summary>\n          <div class=\"answer\"><span>거동이 불편해 의료기관을 방문하기 어려운 <strong>장기요양보험 수급자</strong>가 주된 대상입니다. 장기요양 등급을 받은 어르신이라면 거주지 시·군·구의 재택의료센터에 신청할 수 있습니다. 장기요양 등급이 없더라도 방문진료 시범사업 참여 병의원을 통해 진료를 받을 수 있는 경우가 있습니다.</span></div>\n        </details>\n        <details>\n          <summary>어떤 서비스를 받나요?</summary>\n          <div class=\"answer\"><span>의사의 방문진료, 간호사의 방문간호, 사회복지사의 돌봄 자원 연계가 한 팀으로 제공됩니다. 정기 방문으로 만성질환과 복용 약을 관리하고, 필요할 때 전화 상담과 교육·상담을 함께 받습니다.</span></div>\n        </details>\n        <details>\n          <summary>비용은 얼마나 드나요?</summary>\n          <div class=\"answer\"><span>건강보험과 장기요양보험이 적용되므로 본인부담금만 내면 됩니다. 기관과 서비스 종류에 따라 차이가 있어, 이용 전 해당 기관에 확인하시는 것이 정확합니다.</span></div>\n        </details>\n        <details>\n          <summary>재택의료센터와 가정간호는 어떻게 다른가요?</summary>\n          <div class=\"answer\"><span><strong>재택의료센터</strong>는 의사·간호사·사회복지사가 한 팀으로 정기 방문하는 장기요양 기반 서비스입니다. <strong>가정간호</strong>는 의사의 의뢰를 받은 가정전문간호사가 상처 관리, 튜브 교체 같은 처치를 제공하는 건강보험 서비스입니다. 두 가지를 함께 이용하는 경우도 있습니다.</span></div>\n        </details>\n        <details>\n          <summary>방문진료는 어떻게 신청하나요?</summary>\n          <div class=\"answer\"><span>일차의료 방문진료 시범사업에 참여하는 의원에 직접 전화해 신청합니다. 우리 동네 참여 기관은 <a class=\"inline\" href=\"local.html#visit\">방문진료 병의원 검색</a>에서 확인할 수 있습니다.</span></div>\n        </details>\n        <details>\n          <summary>야간이나 주말에도 연락할 수 있나요?</summary>\n          <div class=\"answer\"><span>기관에 따라 다릅니다. 24시간 전화 상담 체계를 운영하는 곳도 있고, 평일 근무시간에만 대응하는 곳도 있습니다. 등록 전에 야간·주말 대응 방식을 꼭 확인하세요.</span></div>\n        </details>\n        <details>\n          <summary>입원해 있던 부모님이 퇴원하는데, 집에서 어떻게 이어가나요?</summary>\n          <div class=\"answer\"><span>퇴원 전에 병원의 사회사업팀이나 퇴원지원 담당자에게 재택의료 연계를 요청하는 것이 가장 빠릅니다. 이미 퇴원했다면 거주지 시·군·구의 재택의료센터에 직접 문의하면 됩니다.</span></div>\n        </details>\n        <details>\n          <summary>보호자가 함께 살지 않아도 이용할 수 있나요?</summary>\n          <div class=\"answer\"><span>가능합니다. 다만 방문 시간에 문을 열어줄 사람이 필요하고 처치 후 관리가 필요한 경우가 있어, 기관과 미리 상황을 공유하는 것이 좋습니다. 사회복지사가 지역 돌봄 서비스를 함께 연결해 드립니다.</span></div>\n        </details>\n        </div>\n\n        <div class=\"finder mt-4 reveal\">\n          <h3 style=\"font-size:1.125rem;\">질문 남기기</h3>\n          <p class=\"card__excerpt mt-1\" style=\"-webkit-line-clamp:none;\">\n            궁금하신 사항을 남겨주시면 담당 기자가 확인해 답변해 드립니다.\n          </p>\n          <form class=\"mt-3\" data-subscribe novalidate>\n            <div class=\"finder__row\">\n              <label class=\"sr-only\" for=\"qa-name\">이름</label>\n              <input class=\"field\" id=\"qa-name\"   var app = document.getElementById('app');

  function parse(hash) {
    var raw = (hash || '').replace(/^#\/?/, '');
    if (!raw) return { view: 'index', cat: '', anchor: '' };

    var anchor = '';
    var hi = raw.indexOf('#');
    if (hi > -1) { anchor = raw.slice(hi + 1); raw = raw.slice(0, hi); }

    var cat = '';
    var qi = raw.indexOf('?');
    if (qi > -1) {
      var m = /(?:^|&)cat=([^&]*)/.exec(raw.slice(qi + 1));
      raw = raw.slice(0, qi);
      if (m) cat = decodeURIComponent(m[1]);
    }

    if (!VIEWS[raw]) raw = 'index';
    return { view: raw, cat: cat, anchor: anchor };
  }

  function markCurrent(view, cat) {
    var want = view === 'index' ? 'news.html'
             : view === 'news'  ? (cat ? 'news.html?cat=' + cat : 'news.html')
             : view + '.html';
    Array.prototype.forEach.call(app.querySelectorAll('.mainnav__link'), function (a) {
      if (a.getAttribute('data-href') === want) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
  }

  // 내부 .html 링크를 해시 경로로 바꾼다
  function rewrite(root) {
    Array.prototype.forEach.call(root.querySelectorAll('a[href]'), function (a) {
      var href = a.getAttribute('href');
      if (!href || !/\.html(\?|#|$)/.test(href)) return;
      a.setAttribute('data-href', href);
      a.setAttribute('href', '#/' + href.replace(/\.html/, ''));
    });
  }

  function render(state) {
    window.__hcjCat = state.cat;
    app.innerHTML = VIEWS[state.view];
    rewrite(app);
    markCurrent(state.view, state.cat);
    document.title = TITLES[state.view] || TITLES.index;
    if (window.HCJ && window.HCJ.init) window.HCJ.init();

    if (state.anchor) {
      var target = document.getElementById(state.anchor);
      if (target) { target.scrollIntoView(); return; }
    }

  }

  window.addEventListener('hashchange', function () { render(parse(window.location.hash)); });
  render(parse(window.location.hash));
